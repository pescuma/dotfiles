"$schema" = 'https://starship.rs/config-schema.json'

format = """
(\
$status\
$cmd_duration
)\
$all\
(  $fill  )\
$memory_usage\
$battery\
$time\
$line_break\
$character"""

[fill]
symbol = '·'
style = '#444444'

[line_break]
disabled = false

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
format = '[   $time]($style)'
style = ''

[aws]
symbol = " "

[azure]
symbol = " "

[battery]
format = "[  $symbol$percentage]($style)"
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰂑 "
empty_symbol = "󰂎 "

[[battery.display]]
threshold = 10
style = 'bold red'

[[battery.display]]
threshold = 30
style = 'yellow'

[[battery.display]]
threshold = 100
style = 'bright-black'

[buf]
symbol = " "

[bun]
